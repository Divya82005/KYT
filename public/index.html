<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  
  <!-- CRITICAL: Load images first, before anything else -->
  <link rel="preload" href="/static/media/City.png" as="image" fetchpriority="high">
  <link rel="preload" href="/static/media/Img1.png" as="image" fetchpriority="high">
  <link rel="preload" href="/static/media/Img2.png" as="image" fetchpriority="high">
  <link rel="preload" href="/static/media/Img3.png" as="image" fetchpriority="high">
  
  <link rel="icon" href="./logo.svg" type="image/svg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="KnowYourTrips - Your Personal Travel Assistant" />
  
  <!-- SUPER AGGRESSIVE IMAGE PRELOADING FOR INCOGNITO -->
  <script>
    // Start downloading images IMMEDIATELY - no waiting
    (function() {
      // Create hidden div to force immediate loading
      var div = document.createElement('div');
      div.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;';
      
      var images = [
        '/static/media/City.png',
        '/static/media/Img1.png', 
        '/static/media/Img2.png',
        '/static/media/Img3.png'
      ];
      
      images.forEach(function(src) {
        // Method 1: Hidden img elements for immediate caching
        var img = document.createElement('img');
        img.src = src;
        img.loading = 'eager';
        div.appendChild(img);
        
        // Method 2: Image objects
        var imgObj = new Image();
        imgObj.src = src;
      });
      
      document.head.appendChild(div);
    })();
  </script>
  
  <!-- DNS prefetch for faster loading -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="./manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Know Your Trips</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</html>
