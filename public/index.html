<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./logo.svg" type="image/svg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="KnowYourTrips - Your Personal Travel Assistant" />
  
  <!-- DNS prefetch for faster image loading -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  
  <!-- Aggressive resource hints for images -->
  <link rel="prefetch" href="/static/media/City.png">
  <link rel="prefetch" href="/static/media/Img1.png">
  <link rel="prefetch" href="/static/media/Img2.png">
  <link rel="prefetch" href="/static/media/Img3.png">
  
  <!-- High priority preload for critical hero image -->
  <link rel="preload" href="/static/media/City.png" as="image" fetchpriority="high">
  
  <!-- Preload critical images for faster loading -->
  <script>
    // Ultra-aggressive preloading - start immediately
    (function() {
      const images = [
        '/static/media/City.png',
        '/static/media/Img1.png',
        '/static/media/Img2.png',
        '/static/media/Img3.png'
      ];
      
      // Method 1: Immediate Image objects
      images.forEach(function(src) {
        const img = new Image();
        img.src = src;
      });
      
      // Method 2: Force browser cache with fetch
      images.forEach(function(src) {
        if (window.fetch) {
          fetch(src, { mode: 'no-cors' }).catch(function() {});
        }
      });
    })();
  </script>
  
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="./manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Know Your Trips</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
</body>

</html>
