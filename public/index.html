<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./logo.svg" type="image/svg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="KnowYourTrips - Your Personal Travel Assistant" />
  
  <!-- Preload critical images for faster loading -->
  <script>
    // More aggressive preloading - create hidden img elements
    document.addEventListener('DOMContentLoaded', function() {
      // Create a hidden container for preloaded images
      const preloadContainer = document.createElement('div');
      preloadContainer.style.display = 'none';
      preloadContainer.style.position = 'absolute';
      preloadContainer.style.left = '-9999px';
      preloadContainer.id = 'image-preloader';
      
      // Common webpack paths for React assets
      const imagePaths = [
        '/static/media/City.png',
        '/static/media/Img1.png',
        '/static/media/Img2.png',
        '/static/media/Img3.png',
        // Also try with hash patterns that webpack might use
        '/static/media/City.*.png',
        '/static/media/Img1.*.png',
        '/static/media/Img2.*.png',
        '/static/media/Img3.*.png'
      ];
      
      imagePaths.forEach(src => {
        const img = new Image();
        img.src = src;
        img.onload = function() {
          console.log('Preloaded:', src);
        };
        img.onerror = function() {
          // Try alternative paths if main path fails
          const altSrc = src.replace('/static/media/', '/assets/');
          const altImg = new Image();
          altImg.src = altSrc;
        };
        preloadContainer.appendChild(img);
      });
      
      document.body.appendChild(preloadContainer);
    });
  </script>
  
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="./manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Know Your Trips</title>
</head>
