[build]
  publish = "build"
  command = "npm run build"

# Image optimization
[[headers]]
  for = "/static/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Preload critical resources
[[headers]]
  for = "/*"
  [headers.values]
    Link = '''</static/media/City.png>; rel=preload; as=image; fetchpriority=high,
              </static/media/Img1.png>; rel=preload; as=image; fetchpriority=high,
              </static/media/Img2.png>; rel=preload; as=image; fetchpriority=high,
              </static/media/Img3.png>; rel=preload; as=image; fetchpriority=high'''

# Enable compression
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200